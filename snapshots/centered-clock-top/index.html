<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Feeder v1.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="landscape" class="landscape">
      <div id="clock" class="clock">
        <span id="clock-day" class="clock-day"></span>
        <span id="clock-rest" class="clock-rest"></span>
      </div>

      <div class="stage">
        <section class="panel">
          <h1>Cat Feeder v1.0</h1>
          <p id="status"></p>
          <button id="feed-btn" type="button">Feed Kitty</button>
        </section>

        <div id="kitty-wrap" class="kitty-wrap">
          <img
            id="kitty"
            class="kitty"
            src="images/kitty.png"
            alt="A happy kitty"
          />
          <div id="hearts" class="hearts" aria-hidden="true"></div>
        </div>
      </div>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
